<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İNKA Akademi Değerlendirme Sınavı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --navy:#0b2a49; --navy2:#153a5e; --gold:#b6862c; --gold-l:#e3c274; --gold-d:#8f6a1f;
    --bg:#f4f6f9; --card:#ffffff; --ink:#182430; --muted:#586b7d; --line:#dde4ec;
    --ok:#1c7a3c; --ok-bg:#e7f2ea; --bad:#a92a25; --bad-bg:#faeae8; --warn:#8a6400; --warn-bg:#f8efd9;
    --shadow:0 8px 28px rgba(11,42,73,.13);
    --font-sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --font-serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
    --font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px 90px}
  a{color:var(--navy2)}
  :focus-visible{outline:3px solid var(--gold-l);outline-offset:2px;border-radius:4px}

  header.topbar{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-bottom:4px solid var(--gold)}
  header.topbar .wrap{padding:18px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{width:54px;height:54px;border-radius:10px;flex:0 0 auto;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;border:0;padding:5px;overflow:hidden}
  .logo svg,.logo img{display:block;max-width:100%;max-height:100%}
  header.topbar h1{font-size:1.08rem;margin:0;font-weight:600;letter-spacing:.3px;font-family:var(--font-serif)}
  header.topbar p{margin:2px 0 0;font-size:.82rem;opacity:.85}
  .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
  .langtoggle{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:8px;overflow:hidden}
  .langtoggle button{background:transparent;color:#fff;border:0;padding:7px 12px;font-weight:600;font-size:.8rem;cursor:pointer;letter-spacing:.5px;font-family:var(--font-sans)}
  .langtoggle button.active{background:var(--gold);color:var(--navy)}
  .iconbtn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font-size:.95rem;cursor:pointer;line-height:1}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow);margin-top:20px}
  h2{margin:0 0 12px;font-size:1.3rem;color:var(--navy);font-family:var(--font-serif);font-weight:600;text-wrap:balance}
  h3{margin:0 0 8px;font-size:1rem;color:var(--navy2);font-weight:600}
  p.lead{color:var(--muted);margin:0 0 16px;max-width:62ch}
  ul.rules{margin:0 0 8px;padding-left:20px}
  ul.rules li{margin:6px 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  label.fld{display:block;font-weight:600;margin:14px 0 6px;font-size:.9rem}
  .grid2 label.fld{margin-top:4px}
  input[type=text],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:1rem;background:#fbfcfe;font-family:inherit;color:inherit}
  select:focus{outline:2px solid var(--gold-l);border-color:var(--gold)}
  input[type=text]:focus{outline:2px solid var(--gold-l);border-color:var(--gold)}
  input[type=number]{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;background:#fbfcfe;font-family:inherit;width:90px}
  .checkrow{display:flex;align-items:flex-start;gap:10px;margin-top:16px;font-size:.9rem;color:var(--muted)}
  .checkrow input{margin-top:3px;width:18px;height:18px;flex:0 0 auto}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .05s ease,background .15s ease;min-height:44px;font-family:inherit}
  .btn:hover{background:var(--navy2)}
  .btn:active{transform:translateY(1px)}
  .btn.gold{background:var(--gold);color:#fff}
  .btn.gold:hover{background:var(--gold-d)}
  .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
  .btn.ghost:hover{background:#eef2f8}
  .btn.sm{padding:8px 14px;font-size:.85rem;min-height:36px}
  .btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}

  .stepper{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 4px}
  .stepper i{width:22px;height:6px;border-radius:99px;background:#e0e7ef;font-size:0}
  .stepper i.done{background:var(--ok)}
  .stepper i.failed{background:var(--bad)}
  .stepper i.cur{background:var(--gold);box-shadow:0 0 0 2px var(--gold-l)}
  .stepcap{font-size:.78rem;color:var(--muted);margin-bottom:14px}

  .progress-outer{margin:16px 0 6px}
  .progress-bar{height:9px;background:#e2e9f0;border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));width:0;transition:width .25s ease}
  .progress-meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:7px;gap:10px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;padding:3px 9px;border-radius:99px;font-weight:600;font-size:.76rem}
  .chip.time{background:var(--warn-bg);color:var(--warn)}
  .chip.time.crit{background:var(--bad-bg);color:var(--bad)}
  .chip.focus{background:var(--bad-bg);color:var(--bad)}

  .navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:16px 0 4px}
  @media(max-width:480px){.navgrid{grid-template-columns:repeat(5,1fr)}}
  .navgrid button{border:1px solid var(--line);background:#fbfcfe;border-radius:7px;padding:7px 0;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted);font-family:var(--font-mono)}
  .navgrid button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
  .navgrid button.miss{border-color:var(--bad);color:var(--bad)}

  .q{border-top:1px solid var(--line);padding:18px 0}
  .q:first-of-type{border-top:0}
  .q .qhead{display:flex;gap:10px;font-weight:600;margin-bottom:10px}
  .q .qnum{color:var(--gold-d);font-weight:700;flex:0 0 auto;font-family:var(--font-mono)}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;cursor:pointer;background:#fbfcfe;transition:border-color .1s,background .1s;min-height:44px}
  .opt:hover{border-color:var(--gold)}
  .opt.sel{border-color:var(--navy);background:#eef3fb}
  .opt input{margin-top:3px;flex:0 0 auto;width:18px;height:18px}
  .opt .ol{font-weight:700;color:var(--navy2);flex:0 0 auto;font-family:var(--font-mono)}
  .q.unanswered .qhead .qnum::after{content:" •";color:var(--bad)}

  .result-badge{font-size:1rem;font-weight:700;padding:6px 14px;border-radius:99px;display:inline-block}
  .pass{background:var(--ok-bg);color:var(--ok)} .fail{background:var(--bad-bg);color:var(--bad)}
  .bigscore{font-size:2.4rem;font-weight:700;color:var(--navy);margin:6px 0;font-family:var(--font-serif)}
  .bigscore small{font-size:1rem;color:var(--muted);font-weight:500;font-family:var(--font-sans)}

  table.summary{width:100%;border-collapse:collapse;margin-top:8px;font-size:.92rem}
  table.summary th,table.summary td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
  table.summary th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  table.summary td.sc{font-weight:600;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.summary td.st{text-align:center;white-space:nowrap}
  .pill{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px}

  .review .q .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .review .q .opt.wrongsel{border-color:var(--bad);background:var(--bad-bg)}
  .review .tag{font-size:.74rem;font-weight:700;margin-left:6px}
  .review .tag.c{color:var(--ok)} .review .tag.w{color:var(--bad)}

  .note{background:#f4f7fb;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:.86rem;color:var(--muted);margin-top:14px}
  .note.warn{background:var(--warn-bg);border-color:#e6d3a3;color:var(--warn)}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(11,42,73,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:50;overflow:auto}
  .modal{background:var(--card);border-radius:14px;max-width:640px;width:100%;padding:24px;box-shadow:var(--shadow)}
  .modal h2{display:flex;justify-content:space-between;align-items:center}
  .modal .closex{background:transparent;border:0;font-size:1.4rem;cursor:pointer;color:var(--muted);line-height:1}
  .setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
  .setrow label{font-weight:600}
  .setrow .hint{color:var(--muted);font-weight:400;font-size:.8rem;display:block;margin-top:2px}
  .modchecks{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:.84rem}
  .modchecks label{display:flex;gap:7px;align-items:center;font-weight:400}
  textarea.logbox{width:100%;height:120px;font-family:var(--font-mono);font-size:.72rem;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fbfcfe;color:inherit;white-space:pre}
  .switch{position:relative;display:inline-block;width:44px;height:24px;flex:0 0 auto;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch span{position:absolute;inset:0;background:#cdd7e1;border-radius:99px;transition:.15s;cursor:pointer}
  .switch span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
  .switch input:checked+span{background:var(--ok)}
  .switch input:checked+span::before{transform:translateX(20px)}

  /* ---- INKA landscape certificate ---- */
  #certificate,#record{display:none}
  .cert-inka{position:relative;overflow:hidden;max-width:1040px;margin:0 auto;padding:46px 66px 34px;
    color:#1c2f4a;border:1px solid #c3ccd8;border-radius:4px;box-shadow:var(--shadow);
    background:linear-gradient(125deg,#eef1f5 0%,#dde4ec 42%,#e9edf2 70%,#dfe5ec 100%);
    font-family:var(--font-sans)}
  .cert-inka .ci-z{position:relative;z-index:2}
  .ci-corners{position:absolute;inset:0;z-index:1;pointer-events:none}
  .ci-cn{position:absolute;opacity:.85}
  .ci-cn.tl{top:12px;left:12px}
  .ci-cn.tr{top:12px;right:12px}
  .ci-cn.br{bottom:12px;right:12px}
  .ci-top{display:flex;justify-content:space-between;font-family:var(--font-serif);font-size:.82rem;
    letter-spacing:.6px;color:#22385a}
  .ci-top .r{text-align:right;line-height:1.55}
  .ci-title{text-align:center;font-family:var(--font-serif);font-weight:600;color:#1c2f4a;
    font-size:2.7rem;letter-spacing:5px;margin:16px 0 0;text-transform:uppercase;line-height:1.05}
  .ci-acad{text-align:center;font-family:var(--font-serif);font-weight:500;letter-spacing:7px;
    font-size:1.55rem;margin:4px 0 0;text-transform:uppercase;color:#20365a}
  .ci-that{text-align:center;font-size:.95rem;color:#3a4d6b;margin:12px 0 0}
  .ci-name-wrap{text-align:center;margin:6px 0 6px}
  .ci-name{display:inline-block;font-family:var(--font-serif);font-weight:600;font-size:2.4rem;
    color:#1c2f4a;border-bottom:2px solid #1c2f4a;padding:0 34px 4px;letter-spacing:1px;text-transform:uppercase}
  .ci-course{text-align:center;font-size:1.02rem;color:#243a5c;margin-top:4px}
  .ci-cch{text-align:center;font-size:1rem;color:#243a5c;margin-top:0}
  .ci-list{text-align:center;font-size:.9rem;color:#2b3f63;line-height:1.7;margin:2px auto;max-width:80%}
  .ci-ref{text-align:center;font-size:.82rem;color:#2b3f63;margin-top:6px}
  .ci-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px;gap:20px}
  .ci-logo{flex:0 0 auto}
  .ci-logo svg,.ci-logo img{display:block;height:78px;width:auto}
  .ci-sign{flex:1;text-align:center;padding-bottom:2px}
  .ci-sign .l{border-top:1px solid #1c2f4a;display:inline-block;padding-top:5px;font-size:.82rem;font-weight:600;letter-spacing:.4px}
  .ci-sign .t{font-size:.72rem;letter-spacing:1.5px;color:#3a4d6b;margin-top:2px;text-transform:uppercase}
  .ci-verify{margin-top:12px;text-align:center;font-size:.66rem;color:#4a5b78;overflow-wrap:anywhere}
  .ci-verify code{font-family:var(--font-mono);font-size:.62rem;background:rgba(255,255,255,.5);border:1px solid #c3ccd8;border-radius:5px;padding:4px 7px;display:inline-block;margin-top:3px;color:#22385a}
  .all-certs .cert-page{margin:0 auto 22px}
  .cert-inka.is-demo{opacity:.97}
  .ci-demo{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
    pointer-events:none;font-family:var(--font-serif);font-weight:700;letter-spacing:8px;font-size:3.4rem;
    color:rgba(176,42,37,.16);transform:rotate(-22deg);text-transform:uppercase}
  @media(max-width:640px){
    .cert-inka{padding:26px 22px}
    .ci-title{font-size:1.7rem;letter-spacing:3px}
    .ci-acad{font-size:1.1rem;letter-spacing:4px}
    .ci-name{font-size:1.5rem}
    .ci-list{max-width:100%}
    .ci-foot{flex-direction:column;align-items:center}
  }

  /* ---- Record (portrait) ---- */
  .paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:46px 48px;position:relative;max-width:840px;margin:0 auto;box-shadow:var(--shadow)}
  .cert-frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .c-inner{position:relative;z-index:1}
  .c-top{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px}
  .c-logo{width:54px;height:54px;border-radius:10px;background:radial-gradient(circle at 30% 30%,var(--gold-l),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:21px;font-family:var(--font-serif)}
  .c-company{font-size:1.3rem;font-weight:700;color:var(--navy);letter-spacing:1px;font-family:var(--font-serif)}
  .c-sub{text-align:center;color:var(--muted);font-size:.86rem;margin-bottom:20px}
  h1.c-title{text-align:center;font-size:1.6rem;color:var(--navy);margin:8px 0 4px;letter-spacing:3px;text-transform:uppercase;font-family:var(--font-serif);font-weight:600}
  .c-rule{width:84px;height:3px;background:var(--gold);margin:10px auto 20px}
  .c-text{text-align:center;font-size:.96rem;margin:0 auto 6px;max-width:60ch}
  .c-name{font-size:2rem;font-weight:700;color:var(--navy2);margin:12px 0 6px;border-bottom:2px solid var(--gold);display:inline-block;padding:0 26px 6px;font-family:var(--font-serif)}
  .c-name-wrap{text-align:center}
  .c-areas{display:grid;grid-template-columns:1fr 1fr;column-gap:26px;row-gap:2px;margin:20px auto 12px;font-size:.84rem;max-width:660px}
  .c-areas div{padding:3px 0}
  .c-areas .ck{color:var(--ok);font-weight:700;margin-right:6px}
  .c-meta{display:flex;justify-content:center;gap:10px 26px;margin-top:20px;font-size:.8rem;color:var(--muted);flex-wrap:wrap;text-align:center}
  .c-meta b{font-family:var(--font-mono);color:var(--ink);font-weight:500}
  .c-verify{margin-top:16px;text-align:center;font-size:.72rem;color:var(--muted);overflow-wrap:anywhere;word-break:break-word}
  .c-verify code{display:inline-block;max-width:100%;overflow-wrap:anywhere;font-family:var(--font-mono);font-size:.68rem;background:#f4f7fb;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-top:4px;color:var(--ink)}
  .c-sign{display:flex;justify-content:space-between;margin-top:38px;gap:30px}
  .c-sign div{flex:1;text-align:center;border-top:1px solid var(--navy);padding-top:6px;font-size:.8rem;color:var(--muted)}
  .c-seal{position:absolute;right:54px;bottom:30px;width:86px;height:86px;border-radius:50%;border:2px solid var(--gold);color:var(--gold-d);display:flex;align-items:center;justify-content:center;text-align:center;font-size:.56rem;font-weight:700;transform:rotate(-13deg);opacity:.72;line-height:1.25;text-transform:uppercase;letter-spacing:.5px;font-family:var(--font-serif)}

  /* ---- Record ---- */
  .rec-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:16px}
  .rec-head .c-company{font-size:1.05rem}
  .rec-title{font-family:var(--font-serif);font-size:1.15rem;color:var(--navy);font-weight:600;letter-spacing:.5px}
  .rec-kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:.86rem;margin-bottom:14px}
  .rec-kv div{padding:3px 0;border-bottom:1px dotted var(--line)}
  .rec-kv span{color:var(--muted)}
  table.rec{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:6px}
  table.rec th,table.rec td{border:1px solid var(--line);padding:6px 8px;text-align:center}
  table.rec th{background:#f1f5f9;font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.3px}
  table.rec td.mname{text-align:left}
  table.rec td.tot{font-weight:700;background:#f8fafc}
  .rec-verdict{margin:16px 0;font-size:1rem;font-weight:700}
  .rec-foot{display:flex;justify-content:space-between;gap:30px;margin-top:44px}
  .rec-foot div{flex:1;text-align:center;border-top:1px solid var(--navy);padding-top:6px;font-size:.8rem;color:var(--muted)}
  .rec-gen{margin-top:20px;font-size:.72rem;color:var(--muted);font-family:var(--font-mono)}

  .verify-panel{max-width:560px;margin:40px auto}
  .verify-panel .vbadge{font-size:1.1rem;font-weight:700;padding:10px 18px;border-radius:99px;display:inline-block}

  .admin-stats{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 14px}
  .admin-stats div{flex:1;min-width:130px;background:#f1f5f9;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:center}
  .admin-stats b{display:block;font-size:1.7rem;font-family:var(--font-serif);color:var(--navy);line-height:1.1}
  .admin-stats span{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .searchbar{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:.95rem;background:#fbfcfe;margin-bottom:10px;font-family:inherit;color:inherit}
  .cloudline{font-size:.78rem;color:var(--muted);margin-bottom:10px}
  .cloudline.err{color:var(--bad);font-weight:600}
  .adm-table .cbcell{width:34px;text-align:center}
  .adm-table .cbcell input{width:16px;height:16px;cursor:pointer}
  .adm-table tbody tr:hover .cbcell{background:transparent}
  .editgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:12px 0}
  @media(max-width:520px){.editgrid{grid-template-columns:1fr}}
  .filterchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chipbtn{border:1px solid var(--line);background:#fbfcfe;border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted);font-family:inherit}
  .chipbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  table.adm-table{font-size:.78rem}
  table.adm-table tbody tr{cursor:pointer}
  table.adm-table tbody tr:hover{background:#eef3fb}
  table.adm-table td{white-space:nowrap}

  .foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:28px}

  @media(max-width:560px){
    .paper{padding:26px 20px}
    .c-areas,.rec-kv{grid-template-columns:1fr}
    .c-name{font-size:1.5rem}
    .bigscore{font-size:2rem}
    .c-seal{right:20px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}

  @media print{
    body{background:#fff}
    header.topbar,.no-print,.foot{display:none !important}
    .wrap{padding:0;max-width:none}
    #app{display:none !important}
    #certificate,#record{display:none}
    body.printing-cert #certificate{display:block !important}
    body.printing-record #record{display:block !important}
    .paper{border:none;box-shadow:none;max-width:none;padding:14px}
    .cert-inka .ci-verify code,table.rec th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    /* one certificate = exactly one landscape page */
    .cert-inka{border:none;box-shadow:none;max-width:none;width:100%;
      padding:10px 44px 8px;page-break-inside:avoid;break-inside:avoid;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    .cert-inka .ci-title{font-size:2rem;letter-spacing:3px;margin-top:6px}
    .cert-inka .ci-acad{font-size:1.15rem;letter-spacing:5px;margin-top:2px}
    .cert-inka .ci-that{font-size:.85rem;margin-top:5px}
    .cert-inka .ci-name-wrap{margin:4px 0}
    .cert-inka .ci-name{font-size:1.8rem;padding-bottom:3px}
    .cert-inka .ci-course{font-size:.92rem;margin-top:3px}
    .cert-inka .ci-cch{font-size:.9rem}
    .cert-inka .ci-list{font-size:.8rem;line-height:1.45;margin:2px auto}
    .cert-inka .ci-ref{font-size:.74rem;margin-top:4px}
    .cert-inka .ci-foot{margin-top:12px}
    .cert-inka .ci-logo svg,.cert-inka .ci-logo img{height:60px}
    .cert-inka .ci-verify{margin-top:8px;font-size:.58rem}
    .cert-inka .ci-verify code{font-size:.54rem;padding:3px 5px}
    .cert-inka .ci-corners .ci-cn{transform:scale(.8);transform-origin:top left}
    .cert-inka .ci-cn.tr{transform:scale(.8);transform-origin:top right}
    .all-certs .cert-page{page-break-after:always;break-after:page;margin:0}
    .all-certs .cert-page:last-child{page-break-after:auto;break-after:auto}
    @page{size:A4 portrait;margin:12mm}
  }
</style>

/* fetch with a hard timeout so a blocked/hung request never freezes the UI */
function sbFetch(url, opts, ms){
  opts = opts || {};
  var to, timed = new Promise(function(_,rej){ to=setTimeout(function(){ rej(new Error("timeout")); }, ms||8000); });
  try{
    if(typeof AbortController==="function"){ var ac=new AbortController(); opts.signal=ac.signal;
      timed.catch(function(){ try{ac.abort();}catch(e){} }); }
  }catch(e){}
  return Promise.race([ fetch(url, opts), timed ]).then(function(r){ clearTimeout(to); return r; },
    function(e){ clearTimeout(to); throw e; });
}
/* Plain INSERT — NO ?on_conflict= . PostgREST'in upsert (on_conflict) uç noktası tabloda bir SELECT
   politikası ister; sonuçları kilitlemek için SELECT politikamız yok. Bu yüzden yazma yolu:
   önce düz INSERT (satır yoksa oluşturur; attempt_id tekil olduğu için varsa 409 döner, yok sayılır),
   sonra düz PATCH (sbUpdate) ile alanları güncelle. */
function sbInsert(row){
  if(!SB_ON || !row || !row.attempt_id) return Promise.resolve(false);
  return sbFetch(SB_URL+"/rest/v1/"+SB_TABLE,{
    method:"POST",
    headers:sbHeaders({ "Prefer":"return=minimal" }),
    body:JSON.stringify(row)
  }).then(function(r){ return r.ok; }).catch(function(){ return false; });
}
function sbSave(baseRow, patch){
  if(!SB_ON || !baseRow || !baseRow.attempt_id) return Promise.resolve(false);
  return sbInsert(baseRow).then(function(){ return sbUpdate(baseRow.attempt_id, patch||{}); });

function sbFetchAll(){

    .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });

function sbUpdate(attemptId, patch){
  if(!SB_ON || !attemptId) return Promise.resolve(false);

    method:"PATCH", headers:sbHeaders({ "Prefer":"return=minimal" }), body:JSON.stringify(patch)

function cloudRowToRec(row){
  var rec = (row.record && typeof row.record==="object") ? JSON.parse(JSON.stringify(row.record)) : {};
  function pick(a,b){ return (a!==undefined && a!==null) ? a : b; }
  rec.attemptId = rec.attemptId || row.attempt_id;
  rec.name = pick(rec.name, row.name); rec.rank = pick(rec.rank, row.rank);
  rec.vessel = pick(rec.vessel, row.vessel); rec.sicil = pick(rec.sicil, row.seamans_book_no);
  rec.lang = rec.lang || row.lang; rec.company = rec.company || row.company;
  rec.ts = rec.ts || row.updated_at || row.created_at;
  rec.moduleCount = pick(rec.moduleCount, row.module_count);
  rec.passedCount = pick(rec.passedCount, row.passed_count);
  rec.allPass = pick(rec.allPass, row.all_pass);
  rec.total = pick(rec.total, row.total);
  rec.passMark = rec.passMark || row.pass_mark;
  rec.focusTotal = pick(rec.focusTotal, row.focus_total);
  rec.autoAny = pick(rec.autoAny, row.auto_any);

function mergedRecords(){

  loc.forEach(function(r){ if(r.attemptId && !byId[r.attemptId]) byId[r.attemptId]=r; });
  var arr = Object.keys(byId).map(function(k){ return byId[k]; });
  arr.sort(function(a,b){ return String(b.ts||"").localeCompare(String(a.ts||"")); });

    else { cloudError=true; cloudFails++; if(cloudCache===null) cloudCache=[]; }
    if(then) then();

}
/* Local change applies IMMEDIATELY (then()); cloud sync runs in the background and never blocks the UI */
function deleteRecords(list, then){
  var loc = loadRecords();
  list.forEach(function(r){
    if(r && r.cloudStatus){
      // optimistic: mark the cached copy deleted so it drops from the list at once
      var c=(cloudCache||[]).filter(function(x){return x.attemptId===r.attemptId;})[0]; if(c) c.cloudStatus="deleted";
      sbUpdate(r.attemptId, { status:"deleted" }).then(function(){ refreshCloud(); });
    }
    var i = loc.findIndex(function(x){ return x.attemptId===r.attemptId; });
    if(i>=0) loc.splice(i,1);
  });
  saveRecords(loc);
  if(then) then();

function restoreRecord(r, then){
  if(r && r.cloudStatus==="deleted"){
    var back = (r.mods && r.mods.length && r.finishedAt && r.total!=null) ? "completed"
             : (r.passedCount!=null ? "in_progress" : "registered");
    var c=(cloudCache||[]).filter(function(x){return x.attemptId===r.attemptId;})[0]; if(c) c.cloudStatus=back;
    sbUpdate(r.attemptId, { status: back }).then(function(){ refreshCloud(); });
  }
  if(then) then();
}
function patchRecord(r, patch, then){
  var loc=loadRecords(), i=loc.findIndex(function(x){return x.attemptId===r.attemptId;});
  if(i>=0){ loc[i].name=patch.name; loc[i].rank=patch.rank; loc[i].vessel=patch.vessel; loc[i].sicil=patch.sicil; saveRecords(loc); }
  var c=(cloudCache||[]).filter(function(x){return x.attemptId===r.attemptId;})[0];
  if(c){ c.name=patch.name; c.rank=patch.rank; c.vessel=patch.vessel; c.sicil=patch.sicil; }
  if(r.cloudStatus){
    var rec2 = JSON.parse(JSON.stringify(r));
    rec2.name=patch.name; rec2.rank=patch.rank; rec2.vessel=patch.vessel; rec2.sicil=patch.sicil;
    sbUpdate(r.attemptId, {
      name:patch.name, rank:patch.rank, vessel:patch.vessel, seamans_book_no:patch.sicil, record:rec2
    }).then(function(){ refreshCloud(); });
  }
  if(then) then();
}

function activeCodes(){ return state? state.modules : CFG.modules; }
function MODULES(){ var bc=byCode(lang); return activeCodes().map(function(c){return bc[c];}); }
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function save(){ if(state){ try{ localStorage.setItem(LS_STATE, JSON.stringify(state)); }catch(e){} } }
function load(){ try{ return JSON.parse(localStorage.getItem(LS_STATE)); }catch(e){ return null; } }
function clearState(){ try{ localStorage.removeItem(LS_STATE); }catch(e){} }
function stopTimer(){ if(TICK){ clearInterval(TICK); TICK=null; } }

function h32(str){ var h=0; for(var i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h.toString(36).toUpperCase(); }
function b64urlEnc(s){ try{ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }catch(e){ return ""; } }
function b64urlDec(s){ try{ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return decodeURIComponent(escape(atob(s))); }catch(e){ return ""; } }

var _DLCAP; /* cached downloads capability promise */
function getDownloads(){
  if(_DLCAP===undefined){
    _DLCAP = (window.claude && claude.use) ? claude.use("downloads").catch(function(){return null;}) : Promise.resolve(null);
  }
  return _DLCAP;

function downloadCertDoc(bodyHtml, baseName, landscape){

function blobDownload(fn, doc){
  if(!download(fn, doc, "text/html;charset=utf-8")){
    try{ var w=window.open(); if(w){ w.document.write(doc); w.document.close(); return; } }catch(e){}
    /* last resort: show raw HTML in a full-screen overlay the user can copy/save */

      ov.style.cssText="position:fixed;inset:0;background:#fff;z-index:9999;padding:16px;overflow:auto";

function shuffleArr(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function newState(f){
  var codes = modulesForRole(f.rank);
  var bc=byCode(lang);
  var order={},optOrder={},answers={},focus={};
  codes.forEach(function(c,mi){
    var m=bc[c];
    var qi=m.questions.map(function(_,i){return i;});
    if(f.shuffle) shuffleArr(qi);
    order[mi]=qi; optOrder[mi]={}; answers[mi]={}; focus[mi]=0;
    m.questions.forEach(function(q){
      optOrder[mi][q.n]=["a","b","c","d","e"]; /* şıklar her zaman A–B–C–D–E */
    });
  });
  return {
    attemptId:"A"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    lang:lang, name:f.name, rank:f.rank, vessel:f.vessel, sicil:f.sicil, honor:true, shuffle:!!f.shuffle,
    started:new Date().toISOString(), modules:codes,
    order:order, optOrder:optOrder, answers:answers, results:{}, mtime:{}, clock:{}, focus:focus,
    current:0, phase:"module"
  };
}

/* ---------------- MODULE ---------------- */
function fmtClock(ms){
  if(ms<0) ms=0; var s=Math.round(ms/1000);
  return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);
}
function renderStepper(){
  var cur=state.current, out='<div class="stepper" aria-hidden="true">';
  MODULES().forEach(function(_,i){
    var c="";
    if(state.results[i]) c=state.results[i].passed?"done":"failed";
    if(i===cur) c+=" cur";
    out+='<i class="'+c.trim()+'"></i>';
  });
  out+='</div><div class="stepcap">'+T().stepCap(cur+1, MODULES().length)+'</div>';
  return out;
}
function renderModule(mi){
  stopTimer(); certEl.style.display="none"; recEl.style.display="none";
  var t=T(), m=MODULES()[mi], ord=state.order[mi], ans=state.answers[mi];
  if(!state.mtime[mi]) { state.mtime[mi]={start:new Date().toISOString(), end:null}; save(); }
  if(CFG.timerOn && !state.clock[mi]){ state.clock[mi]={deadline: Date.now()+CFG.timerMin*60000}; save(); }
  var answered=Object.keys(ans).length;

  var html='<div class="card">'+renderStepper()+
    '<span class="chip" style="background:var(--navy);color:#fff">'+t.moduleOf(m.code)+'</span>'+
    '<h2 style="margin-top:10px">'+esc(m.name)+'</h2>'+
    '<div class="progress-outer"><div class="progress-bar"><div class="progress-fill" id="pf"></div></div>'+
      '<div class="progress-meta">'+
        '<span id="pmeta">'+t.answeredMeta(answered)+'</span>'+
        '<span>'+
          (CFG.timerOn?'<span class="chip time" id="timeChip"></span> ':'')+
          '<span class="chip focus" id="focusChip" style="display:'+(state.focus[mi]?'inline-block':'none')+'">'+t.focusChip(state.focus[mi]||0)+'</span> '+
          '<span style="color:var(--muted)">'+t.candidate+': '+esc(state.name)+'</span>'+
        '</span>'+
      '</div></div>'+
    '<div class="navgrid" id="navgrid" role="navigation" aria-label="Sorular"></div>';

  ord.forEach(function(qIdx,pos){
    var q=m.questions[qIdx], letters=state.optOrder[mi][q.n], chosen=ans[q.n];
    html+='<div class="q" data-qn="'+q.n+'" id="q_'+q.n+'" role="radiogroup" aria-label="'+(pos+1)+'">'+
      '<div class="qhead"><span class="qnum">'+(pos+1)+'.</span><span>'+esc(q.text)+'</span></div>';
    letters.forEach(function(L){
      html+='<label class="opt'+(chosen===L?" sel":"")+'" data-l="'+L+'">'+
        '<input type="radio" name="m'+mi+'_q'+q.n+'" value="'+L+'"'+(chosen===L?" checked":"")+'>'+
        '<span class="ol">'+L.toUpperCase()+')</span><span>'+esc(q.options[L])+'</span></label>';
    });
    html+='</div>';
  });
  html+='<div class="note" id="warn" style="display:none"></div>'+
    '<div class="btnrow"><button class="btn" id="btnFinish">'+t.finishBtn+'</button></div>'+
    '<p style="font-size:.78rem;color:var(--muted);margin-top:12px">'+t.autosave+'</p></div>';
  app.innerHTML=html;

  buildNav(mi); updateProgress(mi);
  if(CFG.timerOn) startCountdown(mi);

  app.querySelectorAll(".q").forEach(function(qEl){
    qEl.querySelectorAll(".opt").forEach(function(optEl){
      optEl.addEventListener("click",function(){
        var qn=+qEl.getAttribute("data-qn"), L=optEl.getAttribute("data-l");
        state.answers[mi][qn]=L;
        qEl.querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel");});
        optEl.classList.add("sel"); qEl.classList.remove("unanswered");
        var inp=optEl.querySelector("input"); if(inp) inp.checked=true;
        updateProgress(mi); buildNav(mi); save();
      });
    });

}
function buildNav(mi){
  var g=document.getElementById("navgrid"); if(!g) return;
  var m=MODULES()[mi], ord=state.order[mi];
  g.innerHTML=ord.map(function(qIdx,pos){
    var q=m.questions[qIdx]; var done=state.answers[mi][q.n]?" done":"";
    return '<button type="button" data-t="q_'+q.n+'"'+' class="'+done.trim()+'">'+(pos+1)+'</button>';
  }).join("");
  g.querySelectorAll("button").forEach(function(b){
    b.onclick=function(){ var el=document.getElementById(b.getAttribute("data-t")); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); };
  });
}
function updateProgress(mi){
  var answered=Object.keys(state.answers[mi]).length;
  var pf=document.getElementById("pf"), pm=document.getElementById("pmeta");
  if(pf) pf.style.width=(answered/Q_PER*100)+"%";
  if(pm) pm.textContent=T().answeredMeta(answered);
}
function startCountdown(mi){
  var chip=document.getElementById("timeChip"); if(!chip) return;
  function upd(){
    var rem=state.clock[mi].deadline-Date.now();
    chip.textContent=T().timeChip(fmtClock(rem));
    chip.classList.toggle("crit", rem<=120000);
    if(rem<=0){ stopTimer(); autoSubmit(mi); }
  }
  upd(); TICK=setInterval(upd,1000);
}
function autoSubmit(mi){
  if(state.results[mi]) return;
  gradeModule(mi,true);
}
function tryFinish(mi,auto){
  if(!auto){
    var missing=[];
    MODULES()[mi].questions.forEach(function(q){ if(!state.answers[mi][q.n]) missing.push(q.n); });
    if(missing.length){
      var w=document.getElementById("warn");
      w.style.display="block"; w.innerHTML=T().blankWarn(missing.length);
      app.querySelectorAll(".q").forEach(function(qEl){
        if(missing.indexOf(+qEl.getAttribute("data-qn"))>=0) qEl.classList.add("unanswered");
      });
      var g=document.getElementById("navgrid");
      if(g) g.querySelectorAll("button").forEach(function(b,i){
        var qn=MODULES()[mi].questions[state.order[mi][i]].n;
        if(missing.indexOf(qn)>=0) b.classList.add("miss");
      });
      var first=document.getElementById("q_"+missing[0]); if(first) first.scrollIntoView({behavior:"smooth",block:"center"});
      var b2=document.getElementById("btnFinish"); b2.textContent=T().finishAnyway;
      b2.onclick=function(){ if(isLastModule(mi) && !confirm(T().finalConfirm)) return; gradeModule(mi,false); };
      return;
    }
  }
  if(!auto && isLastModule(mi) && !confirm(T().finalConfirm)) return;
  gradeModule(mi,auto);
}
function isLastModule(mi){
  if(state.retakeQueue){ return state.retakeQueue.indexOf(mi)===state.retakeQueue.length-1; }
  return mi===MODULES().length-1;
}
function gradeModule(mi,auto){
  stopTimer();
  var m=MODULES()[mi], correct=0;
  m.questions.forEach(function(q){ if(state.answers[mi][q.n]===q.answer) correct++; });
  if(!state.mtime[mi]) state.mtime[mi]={start:state.started,end:null};
  state.mtime[mi].end=new Date().toISOString();
  state.results[mi]={correct:correct, wrong:Q_PER-correct, passed:correct>=CFG.passMark, auto:!!auto};
  state.phase="moduleResult"; save(); cloudPushProgress();
  renderModuleResult(mi); window.scrollTo(0,0);
}

function reviewHtml(mi){

    var q=m.questions[qIdx], chosen=state.answers[mi][q.n], ok=chosen===q.answer;
    out+='<div class="q"><div class="qhead"><span class="qnum">'+(pos+1)+'.</span><span>'+esc(q.text)+

function moduleDurationMs(mi){
  var mt=state.mtime[mi]; if(!mt||!mt.start||!mt.end) return null;
  return new Date(mt.end)-new Date(mt.start);
}
function fmtDur(ms){
  if(ms==null) return "—";
  var s=Math.round(ms/1000); return Math.floor(s/60)+" "+T().min+" "+("0"+(s%60)).slice(-2)+" "+T().sec;
}
function loadRecords(){ try{ return JSON.parse(localStorage.getItem(LS_LOG)||"[]")||[]; }catch(e){ return []; } }
function saveRecords(a){ try{ localStorage.setItem(LS_LOG, JSON.stringify(a.slice(-400))); }catch(e){} }

/* Build a full, self-contained result record from the current state */
function buildRecord(){
  var mods=MODULES().map(function(m,mi){
    var r=state.results[mi]||{correct:0,passed:false,auto:false};
    var mt=state.mtime[mi]||{};
    var given={};
    (state.answers[mi]||{})&&m.questions.forEach(function(q){ if(state.answers[mi] && state.answers[mi][q.n]) given[q.n]=state.answers[mi][q.n]; });
    return {code:m.code, name:m.name, correct:r.correct, passed:!!r.passed, auto:!!r.auto,
      focus:state.focus[mi]||0,
      ms:(mt.start&&mt.end)?(new Date(mt.end)-new Date(mt.start)):null,
      start:mt.start||null, end:mt.end||null, given:given};
  });
  var passed=mods.filter(function(x){return x.passed;}).length;
  var firstStart=null,lastEnd=null;
  mods.forEach(function(x){
    if(x.start && (!firstStart||new Date(x.start)<new Date(firstStart))) firstStart=x.start;
    if(x.end && (!lastEnd||new Date(x.end)>new Date(lastEnd))) lastEnd=x.end;
  });
  var rec={
    v:1, attemptId:state.attemptId||("A"+Date.now().toString(36)),
    ts:new Date().toISOString(),
    name:state.name, rank:state.rank||"", vessel:state.vessel||"", sicil:state.sicil||"",
    lang:state.lang, company:CFG.company, passMark:CFG.passMark, docRef:CFG.docRef,
    codes:state.modules.slice(), mods:mods,
    total:mods.reduce(function(a,b){return a+b.correct;},0),
    passedCount:passed, moduleCount:mods.length, allPass:passed===mods.length,
    startedAt:firstStart, finishedAt:lastEnd,
    durationMs:(firstStart&&lastEnd)?(new Date(lastEnd)-new Date(firstStart)):null,
    focusTotal:mods.reduce(function(a,b){return a+(b.focus||0);},0),
    autoAny:mods.some(function(x){return x.auto;}),
    honor:!!state.honor
  };
  rec.certNo=grandCertNo(rec);
  return rec;
}
function recResultCode(rec){ return "GSMR1."+b64urlEnc(JSON.stringify(rec)); }
function parseResultCode(code){
  try{
    var p=String(code).trim().split(".");
    if(p[0]!=="GSMR1"||p.length<2) return null;
    var o=JSON.parse(b64urlDec(p.slice(1).join(".")));
    if(!o||!o.attemptId||!Array.isArray(o.mods)) return null;
    return o;
  }catch(e){ return null; }
}
function mergeRecords(list, incoming){
  var byId={}; list.forEach(function(r){ if(r.attemptId) byId[r.attemptId]=r; });
  var added=0;

function download(filename, text, mime){
  try{
    var blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{URL.revokeObjectURL(url); a.remove();}catch(e){} },600);
    return true;
  }catch(e){ return false; }
}

function ymd(d){ return ""+d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2); }
function fmtYMD(s){
  s=String(s||""); var y=s.slice(0,4),m=s.slice(4,6),dd=s.slice(6,8);
  if(lang==="en"){ var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return dd+" "+mo[(+m)-1]+" "+y; }

function recBaseIso(rec){ return rec.startedAt || rec.ts || new Date().toISOString(); }
function certDates(rec){
  var iss=new Date(rec.finishedAt || rec.ts || Date.now());

  return {issYMD:ymd(iss), validYMD:ymd(val)};

    rec.total,rec.passMark||CFG.passMark,(rec.mods||[]).map(function(m){return m.correct;}).join(".")]);

function parseVerifyCode(code){
  try{
    var p=String(code).trim().split(".");
    if(p[0]==="GSM2" && p.length===3){
      var pay=b64urlDec(p[1]); if(!pay || h32(pay).slice(-5)!==p[2]) return null;
      var a=JSON.parse(pay);
      if(a[0]==="m") return {t:"m",name:a[1],sicil:a[2],rank:a[3],vessel:a[4],company:a[5],certNo:a[6],
        issYMD:a[7],validYMD:a[8],lang:a[9],mcode:a[10],mname:a[11],correct:a[12],passMark:a[13]};
      return {t:"f",name:a[1],sicil:a[2],rank:a[3],vessel:a[4],company:a[5],certNo:a[6],issYMD:a[7],validYMD:a[8],
        lang:a[9],N:a[10],total:a[11],passMark:a[12],mods:String(a[13]).split(".").filter(function(x){return x!=="";})};
    }
    if(p[0]==="GSM1" && p.length===3){
      var lp=b64urlDec(p[1]); if(!lp || h32(lp).slice(-5)!==p[2]) return null;
      var la=JSON.parse(lp);
      return {t:"f",name:la[1],sicil:la[2],rank:la[3],vessel:la[4],certNo:la[5],issYMD:la[6],validYMD:la[7],
        total:la[8],passMark:la[9],N:la[10],mods:String(la[11]).split(".").filter(function(x){return x!=="";}),
        lang:la[12],company:la[13]};
    }
    return null;
  }catch(e){ return null; }
}

function recToCsv(recs){
  var head=["tarih","ad","gorev","gemi","seamans_book_no","dil","modul_sayisi","gecilen_modul","tum_gecti",
    "toplam_dogru","gecme_notu","odak_kaybi","oto_teslim","sure_dk","belge_no","moduller(kod:dogru)"];

  recs.forEach(function(r){
    var mods=(r.mods||[]).map(function(m){return m.code+":"+m.correct+(m.passed?"":"*");}).join(" ");
    lines.push([
      r.ts, csv(r.name), csv(r.rank), csv(r.vessel), csv(r.sicil), r.lang,
      r.moduleCount||(r.mods?r.mods.length:""), r.passedCount!=null?r.passedCount:"",

      r.durationMs!=null?Math.round(r.durationMs/60000):"",
      csv(r.certNo||""), csv(mods)
    ].join(";"));
  });
  return lines.join("\n");
}

function answersBlock(rec, t){
  var has=(rec.mods||[]).some(function(m){ return m.given && Object.keys(m.given).length; });
  if(!has) return "";
  var lines=(rec.mods||[]).map(function(m){
    var g=m.given||{}, keys=Object.keys(g).sort(function(a,b){return a-b;});
    if(!keys.length) return "";
    return '<div style="padding:3px 0"><b>'+m.code+'</b> — '+keys.map(function(k){return k+":"+String(g[k]).toUpperCase();}).join("  ")+'</div>';
  }).filter(Boolean).join("");
  return '<details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600;font-size:.88rem">'+t.admAnswers+'</summary>'+
    '<div style="font-family:var(--font-mono);font-size:.76rem;color:var(--muted);margin-top:8px">'+lines+'</div></details>';
}

function render(){
  stopTimer();
  if(adminPoll){ clearInterval(adminPoll); adminPoll=null; }
  var fn=document.getElementById("footNote"); if(fn) fn.style.display="";
  if(!state){ renderIntro(load()); return; }
  if(state.phase==="module") renderModule(state.current);
  else if(state.phase==="moduleResult") renderModuleResult(state.current);
  else if(state.phase==="summary") renderSummary();
  else if(state.phase==="certificate"){ if(!certCtx) certCtx={rec:buildRecord(),fromAdmin:false}; renderCertList(); }
  else if(state.phase==="record") renderRecord();
  else renderIntro(null);
}
